<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9c51c" />
    <title>Humblebee AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="motion.css" />
    <script src="auth.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f5;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        overflow: hidden;
      }

      .gate-shell {
        position: relative;
        width: 100%;
        max-width: 360px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .gate-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(22, 22, 22, 0.08);
        border-radius: 28px;
        padding: 38px 28px 34px;
        box-shadow: 
          0 16px 40px -12px rgba(0, 0, 0, 0.07),
          0 1px 3px rgba(0, 0, 0, 0.03);
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: var(--yellow);
        display: grid;
        place-items: center;
        margin-bottom: 24px;
      }

      .brand-mark svg {
        width: 34px;
        height: 34px;
        fill: var(--ink);
        stroke: var(--ink);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .brand-mark .bee-stripe,
      .brand-mark .bee-wing {
        fill: none;
      }

      .code-display {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--ink);
        line-height: 1;
        margin-bottom: 26px;
        user-select: none;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .code-display:active {
        transform: scale(0.95);
        opacity: 0.7;
      }

      .gate-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .pin-input {
        width: 130px;
        height: 54px;
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: var(--ink);
        background: #ffffff;
        border: 1.5px solid rgba(22, 22, 22, 0.12);
        border-radius: 16px;
        outline: none;
        transition: all 0.2s ease;
        box-sizing: border-box;
      }

      .pin-input:focus {
        border-color: var(--ink);
        box-shadow: 0 0 0 4px rgba(249, 197, 28, 0.35);
      }

      .pin-input.error {
        border-color: #e53935;
        background: #fff5f5;
        animation: shake 0.35s ease;
      }

      .pin-input.success {
        border-color: #2e7d32;
        background: #f1f8f3;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      .btn-submit {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: var(--ink);
        color: #ffffff;
        display: grid;
        place-items: center;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 2px;
      }

      .btn-submit:hover {
        transform: scale(1.06);
        background: #333336;
      }

      .btn-submit:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="gate-shell">
      <div class="gate-card">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36">
            <path d="M10.3 13.6c0-4.1 3.3-7.4 7.4-7.4s7.4 3.3 7.4 7.4v8.8c0 4.1-3.3 7.4-7.4 7.4s-7.4-3.3-7.4-7.4v-8.8Z" />
            <path class="bee-stripe" d="M11.1 14.9h13.2M10.4 20h14.6M11.1 25.1h13.2" />
            <path class="bee-wing" d="M10.6 14.5C6 11.3 2.9 13.9 5.4 18.2c1.2 2 3.2 2.8 5.4 2.7M24.9 14.5c4.6-3.2 7.7-.6 5.2 3.7-1.2 2-3.2 2.8-5.4 2.7" />
            <path class="bee-eye" d="M15.3 12.8h.1M20 12.8h.1" />
          </svg>
        </div>

        <div class="code-display" id="challengeCode" title="Yangilash">--</div>

        <form class="gate-form" id="gateForm" autocomplete="off">
          <input
            type="text"
            id="pinInput"
            class="pin-input"
            maxlength="2"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="••"
            autocomplete="off"
            autofocus
            required
          />
          <button type="submit" class="btn-submit" aria-label="Enter">
            <i class="bi bi-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>

    <script>
      let currentNumber = "";
      let expectedReverse = "";

      const challengeCodeEl = document.getElementById("challengeCode");
      const pinInput = document.getElementById("pinInput");
      const gateForm = document.getElementById("gateForm");

      function generateChallenge() {
        const tens = Math.floor(Math.random() * 9) + 1;
        let units;
        do {
          units = Math.floor(Math.random() * 9) + 1;
        } while (units === tens);

        currentNumber = `${tens}${units}`;
        expectedReverse = `${units}${tens}`;

        challengeCodeEl.textContent = currentNumber;
        pinInput.value = "";
        pinInput.classList.remove("error", "success");
        pinInput.focus();
      }

      function handleVerify() {
        const val = pinInput.value.trim();
        if (val.length === 0) return;

        if (val === expectedReverse) {
          pinInput.classList.remove("error");
          pinInput.classList.add("success");
          sessionStorage.setItem("humblebee_auth", "true");
          localStorage.setItem("humblebee_auth", "true");

          setTimeout(() => {
            const redirectUrl = sessionStorage.getItem("humblebee_redirect_target") || "index.html";
            sessionStorage.removeItem("humblebee_redirect_target");
            window.location.replace(redirectUrl);
          }, 250);
        } else {
          pinInput.classList.remove("success");
          pinInput.classList.add("error");
          setTimeout(() => {
            generateChallenge();
          }, 450);
        }
      }

      pinInput.addEventListener("input", () => {
        pinInput.value = pinInput.value.replace(/[^0-9]/g, "");
        if (pinInput.value.length === 2) {
          handleVerify();
        }
      });

      gateForm.addEventListener("submit", (e) => {
        e.preventDefault();
        handleVerify();
      });

      challengeCodeEl.addEventListener("click", () => {
        generateChallenge();
      });

      generateChallenge();
    </script>
  </body>
</html>
