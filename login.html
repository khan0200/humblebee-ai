<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9c51c" />
    <title>Humblebee AI | Xavfsizlik Tekshiruvi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="motion.css" />
    <script src="auth.js"></script>
    <style>
      .login-container {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }

      .gate-card {
        position: relative;
        width: 100%;
        max-width: 440px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(22, 22, 22, 0.08);
        border-radius: 28px;
        padding: 38px 32px 34px;
        box-shadow: 
          0 10px 40px -10px rgba(0, 0, 0, 0.07),
          0 1px 3px rgba(0, 0, 0, 0.04);
        text-align: center;
        animation: scaleUpIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes scaleUpIn {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .gate-icon-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: var(--yellow);
        box-shadow: 0 8px 20px -6px rgba(249, 197, 28, 0.5);
        margin-bottom: 20px;
      }

      .gate-icon-wrap svg {
        width: 38px;
        height: 38px;
        fill: var(--ink);
        stroke: var(--ink);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .gate-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 999px;
        background: #f1f1ed;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: .02em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .gate-badge i {
        color: #e59f00;
        font-size: 13px;
      }

      .gate-title {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 780;
        letter-spacing: -0.03em;
        color: var(--ink);
      }

      .gate-subtitle {
        margin: 0 0 24px;
        font-size: 14.5px;
        line-height: 1.5;
        color: var(--muted);
      }

      .challenge-panel {
        background: #fafaf8;
        border: 1px dashed rgba(22, 22, 22, 0.14);
        border-radius: 20px;
        padding: 18px 20px;
        margin-bottom: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .challenge-heading {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      .challenge-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .challenge-digits {
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: var(--ink);
        background: #ffffff;
        border: 2px solid rgba(22, 22, 22, 0.08);
        padding: 4px 18px;
        border-radius: 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        user-select: none;
      }

      .refresh-btn {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        border: 1px solid rgba(22, 22, 22, 0.1);
        background: #fff;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .refresh-btn:hover {
        background: var(--yellow);
        color: var(--ink);
        border-color: transparent;
        transform: rotate(90deg);
      }

      .challenge-instruction {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }

      .challenge-instruction strong {
        color: var(--ink);
        font-weight: 700;
      }

      .challenge-example {
        display: inline-block;
        background: rgba(249, 197, 28, 0.18);
        color: #725200;
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 11.5px;
        margin-top: 2px;
      }

      .gate-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .input-group {
        position: relative;
        display: flex;
        justify-content: center;
      }

      .pin-input {
        width: 160px;
        height: 64px;
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: var(--ink);
        background: #ffffff;
        border: 2px solid rgba(22, 22, 22, 0.12);
        border-radius: 16px;
        outline: none;
        transition: all 0.2s ease;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      }

      .pin-input:focus {
        border-color: var(--ink);
        box-shadow: 0 0 0 4px rgba(249, 197, 28, 0.35);
      }

      .pin-input.error {
        border-color: #e53935;
        background: #fff5f5;
        animation: shake 0.4s ease;
      }

      .pin-input.success {
        border-color: #2e7d32;
        background: #f1f8f3;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-8px); }
        40%, 80% { transform: translateX(8px); }
      }

      .status-message {
        min-height: 22px;
        font-size: 13.5px;
        font-weight: 600;
        margin: 0;
        transition: all 0.2s ease;
      }

      .status-message.error {
        color: #d32f2f;
      }

      .status-message.success {
        color: #2e7d32;
      }

      .remember-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13.5px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }

      .remember-row input[type="checkbox"] {
        accent-color: #e59f00;
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .btn-unlock {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 16px;
        background: var(--ink);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 14px rgba(22, 22, 22, 0.15);
      }

      .btn-unlock:hover {
        background: #2a2a2e;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(22, 22, 22, 0.2);
      }

      .btn-unlock:active {
        transform: translateY(0);
      }

      .btn-unlock i {
        font-size: 17px;
        transition: transform 0.2s ease;
      }

      .btn-unlock:hover i {
        transform: translateX(3px);
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <nav class="topbar" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="Humblebee AI home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 36" role="img">
              <path d="M10.3 13.6c0-4.1 3.3-7.4 7.4-7.4s7.4 3.3 7.4 7.4v8.8c0 4.1-3.3 7.4-7.4 7.4s-7.4-3.3-7.4-7.4v-8.8Z" />
              <path class="bee-stripe" d="M11.1 14.9h13.2M10.4 20h14.6M11.1 25.1h13.2" />
              <path class="bee-wing" d="M10.6 14.5C6 11.3 2.9 13.9 5.4 18.2c1.2 2 3.2 2.8 5.4 2.7M24.9 14.5c4.6-3.2 7.7-.6 5.2 3.7-1.2 2-3.2 2.8-5.4 2.7" />
              <path class="bee-eye" d="M15.3 12.8h.1M20 12.8h.1" />
            </svg>
          </span>
          <span>humblebee<span class="brand-dot">.</span>ai</span>
        </a>
        <span class="status-pill"><span class="status-dot"></span>Gate locked</span>
      </nav>

      <div class="login-container">
        <div class="gate-card">
          <div class="gate-icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 36 36">
              <path d="M10.3 13.6c0-4.1 3.3-7.4 7.4-7.4s7.4 3.3 7.4 7.4v8.8c0 4.1-3.3 7.4-7.4 7.4s-7.4-3.3-7.4-7.4v-8.8Z" />
              <path class="bee-stripe" d="M11.1 14.9h13.2M10.4 20h14.6M11.1 25.1h13.2" />
              <path class="bee-wing" d="M10.6 14.5C6 11.3 2.9 13.9 5.4 18.2c1.2 2 3.2 2.8 5.4 2.7M24.9 14.5c4.6-3.2 7.7-.6 5.2 3.7-1.2 2-3.2 2.8-5.4 2.7" />
              <path class="bee-eye" d="M15.3 12.8h.1M20 12.8h.1" />
            </svg>
          </div>

          <div class="gate-badge">
            <i class="bi bi-shield-lock-fill"></i>
            <span>Access Gate</span>
          </div>

          <h1 class="gate-title">Kirish tekshiruvi</h1>
          <p class="gate-subtitle">Sahifani ochish uchun quyidagi 2 xonali raqamning teskarisini kiriting.</p>

          <div class="challenge-panel">
            <span class="challenge-heading">Berilgan raqam</span>
            <div class="challenge-row">
              <span class="challenge-digits" id="challengeCode">--</span>
              <button type="button" class="refresh-btn" id="refreshBtn" title="Boshqa raqam olish">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
            </div>
            <p class="challenge-instruction">
              Raqamning <strong>teskarisini</strong> yozing
            </p>
            <span class="challenge-example" id="exampleTip">Masalan: 45 ➔ 54</span>
          </div>

          <form class="gate-form" id="gateForm" autocomplete="off">
            <div class="input-group">
              <input
                type="text"
                id="pinInput"
                class="pin-input"
                maxlength="2"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="••"
                autocomplete="off"
                autofocus
                required
              />
            </div>

            <p class="status-message" id="statusMessage"></p>

            <label class="remember-row">
              <input type="checkbox" id="rememberMe" checked />
              <span>Ushbu qurilmada eslab qolish</span>
            </label>

            <button type="submit" class="btn-unlock" id="submitBtn">
              <span>Sahifani ochish</span>
              <i class="bi bi-arrow-right"></i>
            </button>
          </form>
        </div>
      </div>

      <footer class="footer-note">
        <span>Powered by curiosity</span>
        <span class="footer-line"></span>
        <span>Humblebee AI Protection</span>
      </footer>
    </main>

    <script>
      let currentNumber = "";
      let expectedReverse = "";

      const challengeCodeEl = document.getElementById("challengeCode");
      const pinInput = document.getElementById("pinInput");
      const statusMessage = document.getElementById("statusMessage");
      const gateForm = document.getElementById("gateForm");
      const refreshBtn = document.getElementById("refreshBtn");
      const rememberMe = document.getElementById("rememberMe");
      const submitBtn = document.getElementById("submitBtn");
      const exampleTip = document.getElementById("exampleTip");

      // Generate a distinct 2-digit number (e.g. tens != units and units != 0)
      function generateChallenge() {
        const tens = Math.floor(Math.random() * 9) + 1; // 1..9
        let units;
        do {
          units = Math.floor(Math.random() * 9) + 1; // 1..9
        } while (units === tens);

        currentNumber = `${tens}${units}`;
        expectedReverse = `${units}${tens}`;

        challengeCodeEl.textContent = currentNumber;
        pinInput.value = "";
        pinInput.classList.remove("error", "success");
        statusMessage.textContent = "";
        statusMessage.className = "status-message";
        pinInput.focus();
      }

      function handleVerify() {
        const userValue = pinInput.value.trim();

        if (userValue.length === 0) {
          pinInput.focus();
          return;
        }

        if (userValue === expectedReverse) {
          // Success
          pinInput.classList.remove("error");
          pinInput.classList.add("success");
          statusMessage.textContent = "To'g'ri! Sahifa ochilmoqda...";
          statusMessage.className = "status-message success";
          submitBtn.disabled = true;

          // Set authentication
          sessionStorage.setItem("humblebee_auth", "true");
          if (rememberMe.checked) {
            localStorage.setItem("humblebee_auth", "true");
          }

          // Smooth redirect
          setTimeout(() => {
            const redirectUrl = sessionStorage.getItem("humblebee_redirect_target") || "index.html";
            sessionStorage.removeItem("humblebee_redirect_target");
            window.location.replace(redirectUrl);
          }, 350);
        } else {
          // Incorrect
          pinInput.classList.remove("success");
          pinInput.classList.add("error");
          statusMessage.textContent = "Noto'g'ri! Qaytadan urinib ko'ring.";
          statusMessage.className = "status-message error";

          setTimeout(() => {
            generateChallenge();
          }, 900);
        }
      }

      // Auto-submit when 2 digits are entered
      pinInput.addEventListener("input", (e) => {
        // Keep only numbers
        pinInput.value = pinInput.value.replace(/[^0-9]/g, "");

        if (pinInput.value.length === 2) {
          handleVerify();
        }
      });

      gateForm.addEventListener("submit", (e) => {
        e.preventDefault();
        handleVerify();
      });

      refreshBtn.addEventListener("click", () => {
        generateChallenge();
      });

      // Initialize
      generateChallenge();
    </script>
  </body>
</html>
