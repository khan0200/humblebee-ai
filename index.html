<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9c51c" />
    <title>Humblebee AI | Explore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="motion.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <nav class="topbar" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="Humblebee AI home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 36" role="img">
              <path d="M10.3 13.6c0-4.1 3.3-7.4 7.4-7.4s7.4 3.3 7.4 7.4v8.8c0 4.1-3.3 7.4-7.4 7.4s-7.4-3.3-7.4-7.4v-8.8Z" />
              <path class="bee-stripe" d="M11.1 14.9h13.2M10.4 20h14.6M11.1 25.1h13.2" />
              <path class="bee-wing" d="M10.6 14.5C6 11.3 2.9 13.9 5.4 18.2c1.2 2 3.2 2.8 5.4 2.7M24.9 14.5c4.6-3.2 7.7-.6 5.2 3.7-1.2 2-3.2 2.8-5.4 2.7" />
              <path class="bee-eye" d="M15.3 12.8h.1M20 12.8h.1" />
            </svg>
          </span>
          <span>humblebee<span class="brand-dot">.</span>ai</span>
        </a>
        <span class="status-pill"><span class="status-dot"></span>Workspace ready</span>
      </nav>

      <section class="menu-grid" aria-label="Explore Humblebee AI">
        <button class="menu-card card-yellow" data-panel="pipeline" type="button">
          <span class="card-icon"><i class="bi bi-diagram-3-fill"></i></span>
          <span class="card-content">
            <span class="card-kicker">01 / ACADEMY</span>
            <strong>Talent pipeline</strong>
            <span class="card-description">From learner to AI talent.</span>
          </span>
          <span class="arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>

        <button class="menu-card card-blue" data-panel="preparation" type="button">
          <span class="card-icon"><i class="bi bi-mortarboard-fill"></i></span>
          <span class="card-content">
            <span class="card-kicker">02 / LEARNING</span>
            <strong>PRE</strong>
            <span class="card-description">A practical AI foundation.</span>
          </span>
          <span class="arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>

        <button class="menu-card card-lilac" data-panel="marketing" type="button">
          <span class="card-icon"><i class="bi bi-lightbulb-fill"></i></span>
          <span class="card-content">
            <span class="card-kicker">03 / GROWTH</span>
            <strong>Marketing strategy</strong>
            <span class="card-description">Ideas into momentum.</span>
          </span>
          <span class="arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>

        <button class="menu-card card-mint" data-panel="bpoint" type="button">
          <span class="card-icon"><i class="bi bi-bullseye"></i></span>
          <span class="card-content">
            <span class="card-kicker">04 / COMMUNITY</span>
            <strong>B point</strong>
            <span class="card-description">Your point of connection.</span>
          </span>
          <span class="arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>
      </section>

      <footer class="footer-note">
        <span>Powered by curiosity</span>
        <span class="footer-line"></span>
        <span>Humblebee AI</span>
      </footer>
    </main>


    <script src="script.js"></script>
    <script src="motion.js"></script>
  </body>
</html>
